<style>
/* Layout: a mown fairway (striped turf) fills the page; one scorecard-style panel sits on it with club tabs, question chips, and the pro's answer card. */
:root {
  --turf-1: #2f6b3a;
  --turf-2: #367741;
  --turf-ink: #0f2614;
  --card: #fbfcf7;
  --card-2: #eef3e6;
  --ink: #1b2a1e;
  --muted: #56655a;
  --line: #cfdac6;
  --flag: #e8b923;
  --flag-ink: #2a2105;
  --pin: #c8402f;
  --link: #1f6a35;
  --display: "Alfa Slab One", "Rockwell", "Georgia", serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --turf-1: #10281a; --turf-2: #13301f; --turf-ink: #06120a;
    --card: #17221a; --card-2: #1e2c21; --ink: #e6efe2; --muted: #a3b3a5;
    --line: #2f4334; --flag: #f0c53a; --flag-ink: #241c03; --pin: #e2675a; --link: #8fd3a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --turf-1: #10281a; --turf-2: #13301f; --turf-ink: #06120a;
  --card: #17221a; --card-2: #1e2c21; --ink: #e6efe2; --muted: #a3b3a5;
  --line: #2f4334; --flag: #f0c53a; --flag-ink: #241c03; --pin: #e2675a; --link: #8fd3a0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background-color: var(--turf-1);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.10), transparent 60%),
    repeating-linear-gradient(115deg, var(--turf-1) 0 64px, var(--turf-2) 64px 128px);
  background-attachment: fixed;
  min-height: 100vh;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}

/* Masthead */
header.mast {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: center;
  color: #fff;
}
.flagstick { width: 58px; height: 72px; }
.mast h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.3rem, 9vw, 3.4rem);
  line-height: 1;
  letter-spacing: .01em;
  text-shadow: 0 2px 0 var(--turf-ink);
  text-wrap: balance;
}
.mast p { margin: 6px 0 0; font-size: 1.02rem; color: #e4f1e0; max-width: 46ch; }

/* Scorecard panel */
.card {
  background: var(--card);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.28);
  overflow: hidden;
}
.card-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px 12px;
  padding: 14px 18px;
  background: var(--flag);
  color: var(--flag-ink);
}
.card-head strong { font-size: 1.05rem; }
.card-head span { font-family: var(--mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-bottom: 1px solid var(--line);
  background: var(--card-2);
}
.tab {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 700 .98rem/1.2 var(--body);
  padding: 14px 6px 12px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  display: grid;
  gap: 3px;
  justify-items: center;
  text-align: center;
  min-width: 0;
}
.tab small { font: 500 .68rem var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pin); background: var(--card); }
.tab:focus-visible, .q:focus-visible, .btn:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }

.questions {
  list-style: none;
  margin: 0;
  padding: 10px;
  display: grid;
  gap: 6px;
}
.q {
  width: 100%;
  text-align: left;
  appearance: none;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: 600 1.02rem/1.3 var(--body);
  padding: 13px 14px;
  border-radius: 10px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 10px;
  transition: border-color .15s, background .15s;
}
.q .hole {
  font: 500 .78rem var(--mono);
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  color: var(--muted);
}
.q .go { color: var(--muted); font-size: 1.2rem; }
.q:hover { border-color: var(--link); }
.q[aria-pressed="true"] { background: var(--card-2); border-color: var(--pin); }
.q[aria-pressed="true"] .hole { background: var(--pin); border-color: var(--pin); color: #fff; }

/* Answer */
.answer { padding: 0; }
.empty {
  padding: 28px 20px;
  text-align: center;
  color: var(--muted);
  display: grid;
  gap: 8px;
  justify-items: center;
}
.empty svg { width: 54px; height: 54px; }
.empty p { margin: 0; max-width: 34ch; }
.ans-body { padding: 20px 20px 8px; display: grid; gap: 16px; }
.eyebrow { font: 500 .74rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--pin); margin: 0; }
.ans-body h2 {
  margin: 2px 0 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.5rem, 5.5vw, 1.9rem);
  line-height: 1.15;
  text-wrap: balance;
}
.ans-body h3 {
  margin: 0 0 6px;
  font-size: .8rem;
  font-family: var(--mono);
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.ans-body p { margin: 0; max-width: 65ch; }
.fixes { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.fixes li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.fixes li::before {
  content: "";
  width: 12px; height: 12px; margin: 7px 0 0 4px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--link);
}
.fixes b { color: var(--ink); }
.drill {
  background: var(--card-2);
  border-left: 4px solid var(--flag);
  border-radius: 0 10px 10px 0;
  padding: 12px 14px;
}
.drill h3 { color: var(--ink); }
.sources { font-size: .92rem; }
.sources ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.sources a { color: var(--link); text-underline-offset: 2px; word-break: break-word; }
.note { font-size: .86rem; color: var(--muted); }

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 12px 18px 18px;
  border-top: 1px dashed var(--line);
}
.btn {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 12px 22px;
  font: 700 1rem var(--body);
  cursor: pointer;
  background: var(--pin);
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:disabled { opacity: .4; cursor: default; }

footer { color: #d6e8d2; font-size: .82rem; text-align: center; }

@media (max-width: 440px) {
  .tab { font-size: .9rem; }
  .ans-body { padding: 18px 16px 6px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ans-body { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

// Irons order: distance and height first, then fixes, then shot-making
(function () {
  const order = ["How can I hit it farther?", "How can I hit it higher?", "How can I hit it lower?",
    "Why do I slice?", "Why do I hook?", "Why do I top it?", "Why do I hit behind the ball?",
    "How do you hit a draw?", "How do you hit a cut?", "How do I hit a knockdown shot?",
    "How do you hit a punch shot?", "How do you hit a stinger?"];
  const irons = DATA.find(d => d.club === "Irons");
  irons.qs.sort((a, b) => order.indexOf(a.q) - order.indexOf(b.q));
})();

const tabsEl = document.getElementById("tabs");
const qEl = document.getElementById("questions");
const ansEl = document.getElementById("answer");
const clearBtn = document.getElementById("clear");
let curClub = 0, curQ = null;

const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function renderTabs() {
  tabsEl.innerHTML = "";
  DATA.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.id = "tab-" + i;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === curClub ? "true" : "false");
    b.innerHTML = `<span>${d.club}</span><small>${d.qs.length} Q</small>`;
    b.onclick = () => { curClub = i; renderTabs(); renderQs(); };
    tabsEl.appendChild(b);
  });
}

function renderQs() {
  qEl.innerHTML = "";
  DATA[curClub].qs.forEach((item, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "q"; b.type = "button"; b.id = `q-${curClub}-${i}`;
    const on = curQ && curQ[0] === curClub && curQ[1] === i;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.innerHTML = `<span class="hole">${i + 1}</span><span>${esc(item.q)}</span><span class="go" aria-hidden="true">›</span>`;
    b.onclick = () => { curQ = [curClub, i]; renderQs(); renderAnswer(true); };
    li.appendChild(b); qEl.appendChild(li);
  });
}

function renderAnswer(scroll) {
  if (!curQ) {
    clearBtn.disabled = true;
    ansEl.innerHTML = `<div class="empty">
      <svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="22" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5"/><circle cx="27" cy="27" r="8" fill="currentColor" opacity=".25"/></svg>
      <p><strong>The pro is ready.</strong></p>
      <p>Choose a club above, then tap a question. The answer and the pro's corrections will appear here.</p>
    </div>`;
    return;
  }
  const d = DATA[curQ[0]], a = d.qs[curQ[1]];
  clearBtn.disabled = false;
  ansEl.innerHTML = `<div class="ans-body">
    <div><p class="eyebrow">${esc(d.club)} · Question ${curQ[1] + 1}</p><h2>${esc(a.q)}</h2></div>
    <div><h3>What's happening</h3><p>${esc(a.why)}</p></div>
    <div><h3>Pro corrections</h3><ul class="fixes">${a.fixes.map(f => `<li><span><b>${esc(f[0])}</b> ${esc(f[1])}</span></li>`).join("")}</ul></div>
    <div class="drill"><h3>Practice drill</h3><p>${esc(a.drill)}</p></div>
    <div class="sources"><h3>Pro sources</h3><ul>${a.src.map(k => `<li><a href="${S[k][1]}" target="_blank" rel="noopener">${esc(S[k][0])}</a></li>`).join("")}</ul></div>
    <p class="note">If a fault keeps coming back, a lesson with a PGA professional who can watch your swing is the fastest fix.</p>
  </div>`;
  if (scroll) ansEl.closest(".card").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

clearBtn.onclick = () => {
  curQ = null; renderQs(); renderAnswer(false);
  window.scrollTo({ top: 0, behavior: "smooth" });
};

renderTabs(); renderQs(); renderAnswer(false);
</script>
